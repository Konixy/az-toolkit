# SPDX-License-Identifier: MPL-2.0

name: CI

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Source tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y file ffmpeg

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build and test sources
        run: make hook test preflight


  desktop-app:
    name: Desktop app (${{ matrix.platform }})
    needs:
      - source

    strategy:
      fail-fast: false

      matrix:
        include:
          - runner: ubuntu-24.04
            platform: Linux x64
            artifact: xdj-az-toolkit-linux-x64
            target: dist/XDJ-AZ Toolkit
            executable: dist/XDJ-AZ Toolkit
            archive: XDJ-AZ-Toolkit-Linux-x64.tar.gz

          - runner: windows-2025
            platform: Windows x64
            artifact: xdj-az-toolkit-windows-x64
            target: dist/XDJ-AZ Toolkit.exe
            executable: dist/XDJ-AZ Toolkit.exe
            archive: XDJ-AZ-Toolkit-Windows-x64.zip

          - runner: macos-15-intel
            platform: macOS Intel
            artifact: xdj-az-toolkit-macos-intel
            target: dist/XDJ-AZ Toolkit.app
            executable: dist/XDJ-AZ Toolkit.app/Contents/MacOS/XDJ-AZ Toolkit
            archive: XDJ-AZ-Toolkit-macOS-Intel.zip

          - runner: macos-latest
            platform: macOS Apple Silicon
            artifact: xdj-az-toolkit-macos-apple-silicon
            target: dist/XDJ-AZ Toolkit.app
            executable: dist/XDJ-AZ Toolkit.app/Contents/MacOS/XDJ-AZ Toolkit
            archive: XDJ-AZ-Toolkit-macOS-Apple-Silicon.zip

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install release dependencies
        run: python -m pip install -r requirements-release.txt

      - name: Test portable build engine
        run: python -m unittest discover -s tests -p test_mod_generator.py

      - name: Test separation engine
        run: python -m unittest discover -s tests -p test_stem_studio.py

      - name: Test desktop application sources
        run: python apps/rx3-toolbox/main.py --self-test

      - name: Build desktop application
        run: pyinstaller --noconfirm --clean apps/rx3-toolbox/rx3_toolbox.spec

      - name: Check packaged macOS libraries
        if: runner.os == 'macOS'
        run: python scripts/check_macos_bundle.py "${{ matrix.target }}"

      - name: Smoke-test packaged application
        run: python scripts/smoke_desktop_app.py "${{ matrix.executable }}"

      - name: Package release
        run: >-
          python scripts/package_release.py
          "${{ matrix.target }}"
          "release/${{ matrix.archive }}"
          --include LICENSE
          --include THIRD_PARTY_NOTICES.md

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error


  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - desktop-app

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: xdj-az-toolkit-*
          path: release
          merge-multiple: true

      - name: List release files
        run: |
          find release -maxdepth 1 -type f -print

      # The changelog is where the release is described in the first place, so
      # the published notes are that section rather than a second account of it.
      - name: Take the release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## $version" '
            $0 == want { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no '## $version' section" >&2
            exit 1
          fi
          cat notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create
          "${GITHUB_REF_NAME}"
          release/*
          --verify-tag
          --notes-file notes.md
          --title "XDJ-AZ Toolkit ${GITHUB_REF_NAME}"
